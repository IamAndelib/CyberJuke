// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Versions live in variables.gradle; load them here so the classpath below can use them.
    apply from: "variables.gradle"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // NewPipeExtractor (and its nanojson dependency) are only published on JitPack.
        // exclusiveContent both ways: TeamNewPipe artifacts come only from JitPack (a same-named
        // artifact elsewhere can't shadow them), and JitPack serves nothing else.
        exclusiveContent {
            forRepository {
                maven { url 'https://jitpack.io' }
            }
            filter { includeGroup 'com.github.TeamNewPipe' }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
