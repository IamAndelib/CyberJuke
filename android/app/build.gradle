import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Versioning: literal values, so F-Droid's `AutoUpdateMode: Version` can read and bump them.
// The Release workflow updates both lines in a commit before it builds and tags.
// versionCode = major * 1000000 + minor * 1000 + patch  (1.0.0 -> 1000000, 1.2.3 -> 1002003)

// Release signing for local builds: only configured when every env var is present. CI does
// not use it: the Release workflow builds unsigned and signs with apksigner in a separate job.
def keystorePath = System.getenv('CYBERJUKE_KEYSTORE')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def hasReleaseSigning = [keystorePath, keystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isEmpty() } && file(keystorePath).exists()

// Preview signing (the separate "CyberJuke Preview" app): its own key, kept only in the
// repository secrets. Without all four variables the preview APK is built unsigned (CI checks).
def previewKeystorePath = System.getenv('PREVIEW_KEYSTORE_FILE')
def previewKeystorePassword = System.getenv('PREVIEW_KEYSTORE_PASSWORD')
def previewKeyAlias = System.getenv('PREVIEW_KEY_ALIAS')
def previewKeyPassword = System.getenv('PREVIEW_KEY_PASSWORD')
def hasPreviewSigning = [previewKeystorePath, previewKeystorePassword, previewKeyAlias, previewKeyPassword]
        .every { it != null && !it.isEmpty() } && file(previewKeystorePath).exists()

android {
    namespace = "io.github.iamandelib.cyberjuke"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.iamandelib.cyberjuke"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1000000
        versionName "1.0.0"
        // App and launcher names live here (not in res/values/strings.xml) so the preview
        // build type can rename itself.
        resValue "string", "app_name", "CyberJuke"
        resValue "string", "title_activity_main", "CyberJuke"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        // No custom debug config: debug builds use each machine's own ~/.android/debug.keystore.
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        if (hasPreviewSigning) {
            preview {
                storeFile file(previewKeystorePath)
                storePassword previewKeystorePassword
                keyAlias previewKeyAlias
                keyPassword previewKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : null
        }
        // A separate app ("CyberJuke Preview", io.github.iamandelib.cyberjuke.preview) that
        // installs alongside the release and never shares its data. Built like a release
        // (R8, same ProGuard rules, not debuggable), signed with the preview key.
        preview {
            initWith release
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            debuggable false
            resValue "string", "app_name", "CyberJuke Preview"
            resValue "string", "title_activity_main", "CyberJuke Preview"
            signingConfig hasPreviewSigning ? signingConfigs.preview : null
            // Library modules (Capacitor and its plugins) only have debug and release.
            matchingFallbacks = ['release']
        }
    }

    testOptions {
        unitTests.all {
            // The YouTube canary (live network) runs only when asked for:
            // ./gradlew testDebugUnitTest -Pcanary=true --tests '*YouTubeCanaryTest*'
            // (-Dcanary=true on the command line works too).
            def canary = project.findProperty('canary') ?: System.getProperty('canary')
            if (canary != null) {
                systemProperty 'canary', canary.toString()
            }
        }
    }

    // Reproducible builds (F-Droid): no encrypted dependency-metadata block in the APK/AAB.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        // Java 21 is also set by capacitor.build.gradle; desugaring is needed by NewPipeExtractor.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/INDEX.LIST',
                'META-INF/LICENSE.md',
                'META-INF/NOTICE.md',
            ]
            pickFirsts += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    // APK file name: CyberJuke-<versionName>-<buildType>.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "CyberJuke-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_21)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation project(':capacitor-android')

    // Native player
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "com.github.TeamNewPipe:NewPipeExtractor:$newPipeExtractorVersion"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:$desugarJdkLibsVersion"

    testImplementation "junit:junit:$junitVersion"
    // Real org.json for JVM unit tests (android.jar only has stubs); ArtistPageTest parses JSON.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
