ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // ---- CyberJuke native player ----
    // Kotlin Gradle plugin. 2.3.x is the line tested against AGP 8.13 / Gradle 8.14.
    kotlinVersion = '2.3.21'
    // https://github.com/TeamNewPipe/NewPipeExtractor (JitPack only).
    // Pinned to the dev commit the NewPipe app ships (2026-08-27), not a tag: it drops the
    // ANDROID/iOS clients upstream calls broken (PR #1529) and only asks the visionOS client
    // for streams. YtCompat.kt and YtMusic.kt are checked against this commit.
    // YouTube breaks old extractor versions: bump this first when playback starts failing.
    newPipeExtractorVersion = '13a655fe53e0c3065f88725fc1fb594c3ede0169'
    // https://github.com/androidx/media/releases - 1.11.1 is the newest stable tag
    // (Google Maven was not reachable to double-check the artifact; TODO verify on CI).
    media3Version = '1.11.1'
    // OkHttp 5.x (okhttp-android) needs compileSdk 37, unsupported by AGP 8.13; stay on 4.x.
    okhttpVersion = '4.12.0'
    // NIO flavour is required by NewPipeExtractor. TODO verify latest (Google Maven only).
    desugarJdkLibsVersion = '2.1.5'
}
