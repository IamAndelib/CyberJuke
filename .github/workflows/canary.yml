name: YouTube canary

# Daily: runs the YouTube canary JVM test against the pinned NewPipeExtractor. It resolves a few
# fixed videos, runs a music search, loads an artist page and looks up lyrics.
#   - a parsing failure ("YouTube changed something") fails the test, and this workflow opens
#     or updates an issue labelled youtube-breakage
#   - a bot check on the runner's IP is inconclusive (the test is skipped, no issue)
#   - a build or infrastructure failure fails the run without touching issues
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: true

env:
  CANARY_TESTS: '*YouTubeCanaryTest*'

jobs:
  canary:
    name: Run the canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result: ${{ steps.classify.outputs.result }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - name: Wait for JitPack to build the pinned NewPipeExtractor
        run: bash scripts/jitpack-warm.sh

      - name: Canary test
        id: test
        continue-on-error: true
        working-directory: android
        # -Pcanary=true is passed to the test JVM as the `canary` system property
        # (android/app/build.gradle); without it the canary test skips itself.
        run: ./gradlew testDebugUnitTest -Pcanary=true --tests "$CANARY_TESTS" --stacktrace

      - name: Classify the result
        id: classify
        run: |
          shopt -s nullglob
          results=(android/app/build/test-results/testDebugUnitTest/TEST-*Canary*.xml)
          if (( ${#results[@]} == 0 )); then
            result=infra
          elif grep -lq '<failure\|<error' "${results[@]}"; then
            result=broken
          elif [[ "${{ steps.test.outcome }}" != success ]]; then
            result=infra
          elif grep -q '<skipped' "${results[@]}"; then
            result=inconclusive
          else
            result=ok
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Canary result: $result"
          {
            echo "### YouTube canary: $result"
            for f in "${results[@]}"; do
              grep -oE '<testcase [^>]*name="[^"]+"|<(failure|error|skipped)[^>]*message="[^"]{0,300}' "$f" \
                | sed -E 's/^<testcase [^>]*name="/- /; s/^<(failure|error|skipped)[^>]*message="/  - \1: /' || true
            done
          } >> "$GITHUB_STEP_SUMMARY"
          case "$result" in
            broken) echo "::error title=YouTube canary failed::A parsing check failed (see the test report)."; exit 1 ;;
            infra) echo "::error title=Canary did not run::The build or test run failed before the canary could report."; exit 1 ;;
            inconclusive) echo "::warning title=Canary inconclusive::YouTube asked the runner for a bot check." ;;
          esac

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-report
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Open or update the youtube-breakage issue
    needs: canary
    if: ${{ always() && needs.canary.outputs.result == 'broken' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create youtube-breakage --color B60205 \
            --description 'The daily canary found a YouTube parsing failure' 2>/dev/null || true
          body="The daily YouTube canary failed on $(date -u +%F) at commit ${GITHUB_SHA::10}: a parsing check failed, which usually means YouTube changed something and NewPipeExtractor needs an update (\`newPipeExtractorVersion\` in \`android/variables.gradle\`).

          Run and test report: $RUN_URL"
          number=$(gh issue list --label youtube-breakage --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
            echo "Commented on #$number"
          else
            gh issue create --title 'YouTube canary: parsing failure' --label youtube-breakage --body "$body"
          fi
