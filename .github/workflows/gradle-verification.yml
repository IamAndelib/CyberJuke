name: Gradle verification metadata

# Manual: generates android/gradle/verification-metadata.xml (SHA-256 of every dependency and
# plugin the build resolves) and uploads it as an artifact. Commit the file to turn on Gradle's
# dependency verification; after that, every dependency change needs this run again (or
# `./gradlew --write-verification-metadata sha256 ...` locally). See CONTRIBUTING.md.
on:
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    name: Generate verification-metadata.xml
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Fresh downloads, so every artifact is checksummed from its repository.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android

      # Every build type and the unit tests, so all their configurations are covered.
      - name: Write verification metadata
        working-directory: android
        run: |
          ./gradlew --write-verification-metadata sha256 \
            help assembleDebug assemblePreview assembleRelease testDebugUnitTest --stacktrace
          ls -la gradle/verification-metadata.xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 30
