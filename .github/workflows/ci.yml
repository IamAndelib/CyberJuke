name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android (assembleDebug)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The GitHub Ubuntu runner image already ships the Android SDK (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle errors as annotations
        if: failure()
        run: |
          # Job logs are not always reachable; annotations are. Surface the key lines.
          { grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | head -40
            awk '/What went wrong/{f=1;n=0} f&&n<40{print;n++} /^\* Try:/{f=0}' "$RUNNER_TEMP/gradle.log"
          } > "$RUNNER_TEMP/errs.txt" || true
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errs.txt" | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle failure::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: CyberJuke-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Emulator smoke test (API 34)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 34
      TARGET: google_apis
      ARCH: x86_64
      PROFILE: pixel_6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: CyberJuke-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Smoke test (install, autoplay, background playback)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          # The runner executes each script line separately: keep this a single command.
          script: bash scripts/ci-smoke.sh apk smoke

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberJuke-smoke-results
          path: smoke
          if-no-files-found: warn
          retention-days: 14
