name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job asks for what it needs; nothing else gets a token scope.
permissions: {}

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  web:
    name: Web (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # No dependency install scripts run in CI (only fsevents has one, and it is macOS-only).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Fails on errors only; warnings show up as annotations.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (Playwright, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Downloads Chromium only on a cache miss; the system libraries are always installed.
      - run: npx playwright install --with-deps chromium

      # Firestore, the music plugin and auth are stubbed by the shared fixture; tests tagged
      # @live need the real backends and are left out here.
      - name: Run e2e tests
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: >-
          npx playwright test --project=e2e --grep-invert @live
          --shard=${{ matrix.shard }}/3 --reporter=list,html

      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  android-unit:
    name: Android unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The Gradle project includes the Capacitor modules from node_modules, and cap sync
      # needs the web build.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - name: Wait for JitPack to build the pinned NewPipeExtractor
        run: bash scripts/jitpack-warm.sh

      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          bash ../scripts/gradlew-retry.sh testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle errors as annotations
        if: failure()
        run: |
          { grep -E '^e: |FAILED$' "$RUNNER_TEMP/gradle.log" | head -40
            awk '/What went wrong/{f=1;n=0} f&&n<40{print;n++} /^\* Try:/{f=0}' "$RUNNER_TEMP/gradle.log"
          } > "$RUNNER_TEMP/errs.txt" || true
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errs.txt" | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle failure::${msg}"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android (assembleDebug, assemblePreview)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The GitHub Ubuntu runner image already ships the Android SDK (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - name: Wait for JitPack to build the pinned NewPipeExtractor
        run: bash scripts/jitpack-warm.sh

      # The preview is built unsigned here (no PREVIEW_* secrets in CI): this checks that the
      # build type compiles and passes R8.
      - name: Build debug and preview APKs
        working-directory: android
        run: |
          set -o pipefail
          bash ../scripts/gradlew-retry.sh assembleDebug assemblePreview --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle errors as annotations
        if: failure()
        run: |
          # Job logs are not always reachable; annotations are. Surface the key lines.
          { grep -E '^e: ' "$RUNNER_TEMP/gradle.log" | head -40
            awk '/What went wrong/{f=1;n=0} f&&n<40{print;n++} /^\* Try:/{f=0}' "$RUNNER_TEMP/gradle.log"
          } > "$RUNNER_TEMP/errs.txt" || true
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errs.txt" | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle failure::${msg}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CyberJuke-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Emulator smoke test (API 34)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      API_LEVEL: 34
      TARGET: google_apis
      ARCH: x86_64
      PROFILE: pixel_6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: CyberJuke-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Smoke test (install, autoplay, background playback)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          # The runner executes each script line separately: keep this a single command.
          script: bash scripts/ci-smoke.sh apk smoke

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CyberJuke-smoke-results
          path: smoke
          if-no-files-found: warn
          retention-days: 14
