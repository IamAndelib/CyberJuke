name: Release

# Manual release, in three jobs:
#   prepare           checks the version and CHANGELOG.md, and commits the version bump
#                     (android/app/build.gradle, package.json) to main
#   build             builds an unsigned release APK from that commit (read-only token, no
#                     secrets, no dependency install scripts)
#   sign-and-publish  signs it with apksigner in the protected "release" environment and
#                     publishes the GitHub release, tagging the bump commit v<version>
# F-Droid builds the same tagged commit and, with reproducible builds, ships this signed APK.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22.22.0' # exact: the F-Droid recipe pins the same build (reproducible APKs)
  JAVA_VERSION: '21'
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    name: Check and bump to v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the version bump commit to main
      actions: read # check that CI passed on the commit being released
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - name: Check inputs
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error title=Wrong branch::Run the release from main (got $GITHUB_REF)."; exit 1
          fi
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid version::'$VERSION' is not semver like 1.0.0 or 1.1.0-beta.1 (no leading v)"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          # The parent too: a retry after the bump commit checks the commit under it.
          fetch-depth: 2
          # This job pushes the bump commit; the build job checks out without credentials.
          persist-credentials: true

      - name: Fail unless CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # A bump commit pushed by an earlier run of this workflow gets no CI run of its own
          # (pushes with the workflow token start no workflows): the commit under it counts.
          if [[ "$(git log -1 --format=%s)" == "Release v$VERSION" ]]; then sha=$(git rev-parse HEAD^); fi
          result=$(gh run list --workflow ci.yml --commit "$sha" --json status,conclusion \
            -q '[.[] | select(.status == "completed")][0].conclusion // "none"')
          if [[ "$result" != "success" ]]; then
            echo "::error title=CI not green::CI on $sha is '$result'. Release only a commit whose CI passed."
            exit 1
          fi
          echo "CI passed on $sha"

      - name: Fail if the tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error title=Tag exists::v$VERSION already exists. Bump the version."
            exit 1
          fi

      - name: Compute versionCode and compare with the current one
        id: ver
        run: |
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( 10#$minor > 999 || 10#$patch > 999 )); then
            echo "::error::minor and patch must be < 1000 for the versionCode scheme"; exit 1
          fi
          # MAJOR*1000000 + MINOR*1000 + PATCH  (1.0.0 -> 1000000, 1.2.3 -> 1002003)
          code=$(( 10#$major * 1000000 + 10#$minor * 1000 + 10#$patch ))
          current_code=$(sed -nE 's/^\s*versionCode\s+([0-9]+)\s*$/\1/p' android/app/build.gradle)
          current_name=$(sed -nE 's/^\s*versionName\s+"([^"]+)"\s*$/\1/p' android/app/build.gradle)
          if [[ -z "$current_code" || -z "$current_name" ]]; then
            echo "::error::Could not read the literal versionCode/versionName from android/app/build.gradle"; exit 1
          fi
          echo "current: $current_name ($current_code), requested: $VERSION ($code)"
          # Equal is allowed only for the version already in the tree (first release, or a
          # retry after the bump commit landed but publishing failed: its tag doesn't exist),
          # and for a final release after its own pre-release (1.1.0-beta.1 -> 1.1.0), which
          # shares the versionCode.
          if (( code < current_code )) || { (( code == current_code )) && [[ "$VERSION" != "$current_name" && "$current_name" != "$VERSION"-* ]]; }; then
            echo "::error title=Version not higher::$VERSION ($code) must be higher than the current $current_name ($current_code)."
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG.md
        run: |
          # Needs a section headed "## [1.0.0]", "## 1.0.0" or "## v1.0.0".
          esc="${VERSION//./\\.}"
          if ! grep -Eq "^## \[?v?${esc}([] ]|$)" CHANGELOG.md; then
            echo "::error title=No changelog entry::Add a '## [$VERSION] - $(date +%F)' section to CHANGELOG.md on main first."
            exit 1
          fi

      - name: Bump versions
        env:
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          sed -i -E "s/^(\s*versionCode\s+)[0-9]+\s*$/\1${CODE}/; s/^(\s*versionName\s+)\"[^\"]+\"\s*$/\1\"${VERSION}\"/" android/app/build.gradle
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts >/dev/null
          # F-Droid shows fastlane/metadata/android/en-US/changelogs/<versionCode>.txt.
          # Write it from the CHANGELOG section if it is missing (F-Droid's limit is 500 chars).
          cl="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [[ -f "$cl" ]] && (( $(wc -c < "$cl") > 500 )); then
            echo "::error title=Changelog too long::$cl is over F-Droid's 500 characters."; exit 1
          fi
          if [[ ! -f "$cl" ]]; then
            awk -v v="$VERSION" '
              BEGIN { esc = v; gsub(/\./, "\\.", esc) }
              /^## / { if (insec) exit; if ($0 ~ ("^## \\[?v?" esc "([] ]|$)")) { insec = 1; next } }
              insec { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/cl.txt"
            if (( $(wc -c < "$RUNNER_TEMP/cl.txt") > 500 )); then
              head -c 440 "$RUNNER_TEMP/cl.txt" | sed '$d' > "$cl"
              printf '\nFull notes: https://github.com/%s/releases/tag/v%s\n' "$GITHUB_REPOSITORY" "$VERSION" >> "$cl"
            else
              cp "$RUNNER_TEMP/cl.txt" "$cl"
            fi
          fi
          git diff --stat

      - name: Commit and push the bump
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/build.gradle package.json package-lock.json fastlane/metadata/android/en-US/changelogs
          if git diff --cached --quiet; then
            echo "Nothing to bump: the tree is already at $VERSION."
          else
            git commit -q -m "Release v$VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release commit: $(git rev-parse HEAD)"

  build:
    name: Build unsigned APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # No caches for release builds: every dependency comes fresh from its repository.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android --deployment
      - name: Wait for JitPack to build the pinned NewPipeExtractor
        run: bash scripts/jitpack-warm.sh

      - name: Build unsigned release APK
        working-directory: android
        run: bash ../scripts/gradlew-retry.sh assembleRelease --stacktrace

      - name: Collect the APK
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one release APK, found ${#apks[@]}"; ls -la android/app/build/outputs/apk/release || true; exit 1
          fi
          mkdir -p out
          cp "${apks[0]}" "out/CyberJuke-$VERSION-unsigned.apk"
          sha256sum "out/CyberJuke-$VERSION-unsigned.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-apk
          path: out/CyberJuke-${{ inputs.version }}-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    name: Sign and publish v${{ inputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing signing secrets::Add these secrets to the 'release' environment (Settings > Environments > release): ${missing[*]}. KEYSTORE_FILE is the base64 of the .jks file (base64 -w0 release.jks). Then re-run with the same version."
            exit 1
          fi

      # CHANGELOG.md (the release notes) and the signing scripts, from the release commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts/sign-apk.sh
            scripts/apk-compare.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: unsigned-apk
          path: unsigned

      - name: Decode keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_FILE" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [[ ! -s "$RUNNER_TEMP/release.jks" ]]; then
            echo "::error::KEYSTORE_FILE did not decode to a keystore (expected base64)"; exit 1
          fi

      - name: Sign and verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          KEYSTORE="$RUNNER_TEMP/release.jks" bash scripts/sign-apk.sh \
            "unsigned/CyberJuke-$VERSION-unsigned.apk" "out/CyberJuke-$VERSION.apk"
          (cd out && sha256sum "CyberJuke-$VERSION.apk" > "CyberJuke-$VERSION.apk.sha256" && cat "CyberJuke-$VERSION.apk.sha256")

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # After the keystore is gone (this runs a tool from PyPI). Nothing is published unless
      # F-Droid's own check would pass: the signed APK is the unsigned build plus a signature.
      - name: Check the signed APK is reproducible
        run: |
          if ! bash scripts/apk-compare.sh "out/CyberJuke-$VERSION.apk" "unsigned/CyberJuke-$VERSION-unsigned.apk"; then
            echo "::error title=Not reproducible::Signing changed the APK beyond adding a signature; F-Droid could not ship it. Nothing was published."
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          found=false
          if [[ -f CHANGELOG.md ]]; then
            # Section headed "## [1.0.0]", "## 1.0.0" or "## v1.0.0" (anything after is ignored)
            awk -v v="$VERSION" '
              BEGIN { esc = v; gsub(/\./, "\\.", esc) }
              /^## / {
                if (insec) exit
                if ($0 ~ ("^## \\[?v?" esc "([] ]|$)")) { insec = 1; next }
              }
              insec { print }
            ' CHANGELOG.md > release-notes.md
            if grep -q '[^[:space:]]' release-notes.md; then found=true; fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "Changelog section found: $found"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: CyberJuke v${{ inputs.version }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            out/CyberJuke-${{ inputs.version }}.apk
            out/CyberJuke-${{ inputs.version }}.apk.sha256
