name: Screenshots

# Manual: renders every screen with Playwright and uploads the PNGs as an artifact.
# Screenshots are no longer committed (media/web-screenshots/ is gitignored); the few used by
# the README and the store listing live in docs/images/ and fastlane/.
on:
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions: {}

jobs:
  screenshots:
    name: Render screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Render
        run: npm run screenshots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: web-screenshots
          path: test-results/screenshots
          if-no-files-found: error
          retention-days: 30
