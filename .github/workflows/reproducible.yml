name: Reproducible build check

# Manual: builds a release tag unsigned, the way F-Droid does, and compares it with the
# signed APK on that GitHub release (apksigcopier). When they match apart from the
# signature, F-Droid can ship the developer-signed APK (Binaries + AllowedAPKSigningKeys
# in its recipe), so F-Droid and GitHub installs update each other.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check (e.g. v1.0.0)'
        required: true
        type: string

permissions: {}

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  TAG: ${{ inputs.tag }}

jobs:
  compare:
    name: Rebuild ${{ inputs.tag }} and compare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.0.0"; exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Like the release build: no caches, every dependency fresh from its repository.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android --deployment
      - name: Wait for JitPack to build the pinned NewPipeExtractor
        run: bash scripts/jitpack-warm.sh

      - name: Build the release APK unsigned
        working-directory: android
        run: bash ../scripts/gradlew-retry.sh assembleRelease --stacktrace

      - name: Download the signed APK from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p signed
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'CyberJuke-*.apk' --dir signed
          ls -l signed

      - name: Compare (apksigcopier)
        run: |
          shopt -s nullglob
          unsigned=(android/app/build/outputs/apk/release/*.apk)
          signed=(signed/CyberJuke-*.apk)
          if (( ${#unsigned[@]} != 1 || ${#signed[@]} != 1 )); then
            echo "::error::Expected one unsigned and one signed APK (got ${#unsigned[@]} and ${#signed[@]})"; exit 1
          fi
          if pipx run 'apksigcopier==1.1.1' compare "${signed[0]}" --unsigned "${unsigned[0]}"; then
            echo "::notice title=Reproducible::$TAG rebuilds byte for byte (apart from the signature). F-Droid can ship the signed APK."
          else
            echo "::error title=Not reproducible::$TAG's rebuild differs from the signed APK. Compare them with diffoscope to see where."
            exit 1
          fi
