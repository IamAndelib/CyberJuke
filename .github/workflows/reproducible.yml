name: Reproducible build check

# Manual: builds a release tag unsigned, the way F-Droid does, and compares it with the
# signed APK on that GitHub release (apksigcopier). When they match apart from the
# signature, F-Droid can ship the developer-signed APK (Binaries + AllowedAPKSigningKeys
# in its recipe), so F-Droid and GitHub installs update each other.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check (e.g. v1.0.0); with against = pinned-node, any branch or commit'
        required: true
        type: string
      against:
        description: "release: the signed APK on that tag's release. pinned-node: a build of the same commit with the pinned Node.js (needs debian_node)"
        required: false
        default: release
        type: choice
        options: [release, pinned-node]
      debian_node:
        description: "Build the web part with Debian's nodejs from this suite instead (e.g. trixie-backports), as the F-Droid recipe can"
        required: false
        default: ''
        type: string

permissions: {}

env:
  NODE_VERSION: '22.22.0' # exact: the F-Droid recipe pins the same build (reproducible APKs)
  JAVA_VERSION: '21'
  TAG: ${{ inputs.tag }}
  DEBIAN_NODE: ${{ inputs.debian_node }}
  AGAINST: ${{ inputs.against }}
  # The image F-Droid's buildserver runs (the recipe adds trixie for JDK 21).
  DEBIAN_IMAGE: debian:bookworm

jobs:
  compare:
    name: Rebuild ${{ inputs.tag }} and compare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check the inputs
        run: |
          if [[ "$AGAINST" == pinned-node ]]; then
            [[ -n "$DEBIAN_NODE" ]] || { echo "::error::against = pinned-node compares with debian_node: set it"; exit 1; }
            [[ "$TAG" =~ ^[0-9A-Za-z._/-]+$ ]] || { echo "::error::'$TAG' is not a ref"; exit 1; }
          elif [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.0.0"; exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.against == 'pinned-node' && inputs.tag || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      # The checking scripts as of this workflow's commit (older tags may not have them).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: .ci
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-apk.sh
            scripts/apk-compare.sh
          sparse-checkout-cone-mode: false

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Like the release build: no caches, every dependency fresh from its repository.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      # against = pinned-node: first the build the Release workflow makes (pinned Node.js),
      # kept as the reference, then the tree is cleaned for the Debian one below.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.AGAINST == 'pinned-node'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Reference build with the pinned Node.js ${{ env.NODE_VERSION }}
        if: env.AGAINST == 'pinned-node'
        run: |
          npm ci --ignore-scripts
          npm run build
          npx cap sync android --deployment
          bash scripts/jitpack-warm.sh
          (cd android && bash ../scripts/gradlew-retry.sh assembleRelease --stacktrace)
          mkdir -p "$RUNNER_TEMP/ref"
          mv android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/ref/CyberJuke-pinned.apk"
          git clean -xdfq -e .ci
          (cd android && ./gradlew --stop) || true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.DEBIAN_NODE == ''
        with:
          node-version: ${{ env.NODE_VERSION }}

      - if: env.DEBIAN_NODE == ''
        run: npm ci --ignore-scripts
      - if: env.DEBIAN_NODE == ''
        run: npm run build
      - if: env.DEBIAN_NODE == ''
        run: npx cap sync android --deployment

      # The F-Droid recipe's way: nodejs and npm from a Debian suite, in the buildserver's image.
      - name: Web build with Debian's nodejs (${{ env.DEBIAN_NODE }})
        if: env.DEBIAN_NODE != ''
        run: |
          [[ "$DEBIAN_NODE" =~ ^[a-z]+(-[a-z]+)?$ ]] || { echo "::error::'$DEBIAN_NODE' is not a Debian suite name"; exit 1; }
          docker run --rm -v "$PWD:/w" -w /w -e SUITE="$DEBIAN_NODE" -e HOST_ID="$(id -u):$(id -g)" "$DEBIAN_IMAGE" bash -ec '
            for s in bookworm-backports trixie trixie-backports forky sid; do
              echo "deb http://deb.debian.org/debian $s main" > /etc/apt/sources.list.d/$s.list
            done
            apt-get update -qq
            for s in bookworm bookworm-backports trixie trixie-backports forky sid; do
              v=$(apt-cache madison nodejs | grep " $s/main " | head -n 1 | cut -d"|" -f2 | tr -d " ")
              echo "::notice title=Debian nodejs::$s: ${v:-none}"
            done
            find /etc/apt/sources.list.d -name "*.list" ! -name "$SUITE.list" -delete
            apt-get update -qq
            apt-get install -y -qq -t "$SUITE" nodejs npm >/dev/null
            echo "::notice title=Node used::$(node --version), npm $(npm --version), from $SUITE"
            # A failure says where, as annotations (the job log may not be at hand).
            run() {
              "$@" > /tmp/out.txt 2>&1 && return 0
              tail -n 15 /tmp/out.txt | while IFS= read -r l; do echo "::error title=$1 $2 failed::${l:0:300}"; done
              exit 1
            }
            run npm ci --ignore-scripts
            run npm run build
            run npx cap sync android --deployment
            chown -R "$HOST_ID" /w
          '
      - name: Wait for JitPack to build the pinned NewPipeExtractor
        run: bash scripts/jitpack-warm.sh

      - name: Build the release APK unsigned
        working-directory: android
        run: bash ../scripts/gradlew-retry.sh assembleRelease --stacktrace

      # The release's signing (scripts/sign-apk.sh), with a throwaway key: it must leave the
      # APK as built, or no later release can be reproducible either.
      - name: Check that signing keeps the APK as built
        run: |
          shopt -s nullglob
          unsigned=(android/app/build/outputs/apk/release/*.apk)
          (( ${#unsigned[@]} == 1 )) || { echo "::error::Expected one unsigned APK"; exit 1; }
          export KEYSTORE="$RUNNER_TEMP/throwaway.jks" KEYSTORE_PASSWORD=throwaway KEY_PASSWORD=throwaway KEY_ALIAS=throwaway
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname CN=throwaway >/dev/null 2>&1
          bash .ci/scripts/sign-apk.sh "${unsigned[0]}" "$RUNNER_TEMP/selfsigned.apk" >/dev/null
          if bash .ci/scripts/apk-compare.sh "$RUNNER_TEMP/selfsigned.apk" "${unsigned[0]}"; then
            echo "::notice title=Signing::scripts/sign-apk.sh keeps the APK as built."
          else
            echo "::error title=Signing::scripts/sign-apk.sh changes the APK beyond adding a signature."; exit 1
          fi

      - name: Download the signed APK from the release
        if: env.AGAINST != 'pinned-node'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p signed
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'CyberJuke-*.apk' --dir signed
          ls -l signed

      - name: Compare with the pinned Node.js build
        if: env.AGAINST == 'pinned-node'
        run: |
          shopt -s nullglob
          unsigned=(android/app/build/outputs/apk/release/*.apk)
          mkdir -p signed && cp "$RUNNER_TEMP/ref/CyberJuke-pinned.apk" signed/
          (( ${#unsigned[@]} == 1 )) || { echo "::error::Expected one unsigned APK"; exit 1; }
          if cmp -s signed/CyberJuke-pinned.apk "${unsigned[0]}"; then
            echo "::notice title=Same APK::Debian's nodejs ($DEBIAN_NODE) builds $TAG byte for byte like Node.js $NODE_VERSION."
          else
            echo "::error title=Different APK::Debian's nodejs ($DEBIAN_NODE) and Node.js $NODE_VERSION build different APKs."; exit 1
          fi

      - name: Compare (apksigcopier)
        if: env.AGAINST != 'pinned-node'
        run: |
          shopt -s nullglob
          unsigned=(android/app/build/outputs/apk/release/*.apk)
          signed=(signed/CyberJuke-*.apk)
          if (( ${#unsigned[@]} != 1 || ${#signed[@]} != 1 )); then
            echo "::error::Expected one unsigned and one signed APK (got ${#unsigned[@]} and ${#signed[@]})"; exit 1
          fi
          if bash .ci/scripts/apk-compare.sh "${signed[0]}" "${unsigned[0]}"; then
            echo "::notice title=Reproducible::$TAG rebuilds byte for byte (apart from the signature). F-Droid can ship the signed APK."
          else
            echo "::error title=Not reproducible::$TAG's rebuild differs from the signed APK. Compare them with diffoscope to see where."
            exit 1
          fi

      # Logs and artifacts may not be at hand: say where the APKs differ as annotations.
      - name: Show what differs
        if: failure()
        run: |
          shopt -s nullglob
          unsigned=(android/app/build/outputs/apk/release/*.apk)
          signed=(signed/CyberJuke-*.apk)
          (( ${#unsigned[@]} == 1 && ${#signed[@]} == 1 )) || exit 0
          note() { echo "::warning title=$1::$2"; }
          note "Sizes" "signed $(stat -c %s "${signed[0]}") B, rebuilt $(stat -c %s "${unsigned[0]}") B"
          # Entries (name, size, CRC, method) in order, apart from the signature files.
          list() { python3 - "$1" <<'PY'
          import sys, zipfile
          for i in zipfile.ZipFile(sys.argv[1]).infolist():
              if i.filename.startswith('META-INF/') and i.filename.rsplit('.', 1)[-1] in ('SF', 'RSA', 'EC', 'DSA', 'MF'):
                  continue
              print(f"{i.filename}\t{i.file_size}\t{i.CRC:08x}\t{i.compress_type}\t{len(i.extra)}")
          PY
          }
          list "${signed[0]}" > s.txt
          list "${unsigned[0]}" > u.txt
          note "Entries" "signed $(wc -l < s.txt), rebuilt $(wc -l < u.txt); same order: $(cut -f1 s.txt | cmp -s - <(cut -f1 u.txt) && echo yes || echo no)"
          diff <(sort s.txt) <(sort u.txt) | grep '^[<>]' | head -n 30 | while IFS= read -r l; do note "Differs" "$l"; done
          # The first differing text-like file: its first changed lines.
          f=$(diff <(sort s.txt) <(sort u.txt) | grep '^<' | cut -f1 | sed 's/^< //' | grep -E '\.(js|json|html|css|txt|xml|properties|textproto)$' | head -n 1 || true)
          if [[ -n "$f" ]]; then
            mkdir -p xs xu
            unzip -q -o "${signed[0]}" "$f" -d xs && unzip -q -o "${unsigned[0]}" "$f" -d xu
            diff <(fold -w 200 "xs/$f") <(fold -w 200 "xu/$f") | head -n 12 | while IFS= read -r l; do note "In $f" "${l:0:400}"; done
          fi
          # The zip alignment / extra fields per entry (zipalign padding shows here).
          python3 - "${signed[0]}" "${unsigned[0]}" <<'PY'
          import sys, zipfile
          a = {i.filename: i for i in zipfile.ZipFile(sys.argv[1]).infolist()}
          b = {i.filename: i for i in zipfile.ZipFile(sys.argv[2]).infolist()}
          n = 0
          for k, i in a.items():
              j = b.get(k)
              if j and (i.extra != j.extra or i.header_offset != j.header_offset) and n < 5:
                  print(f"::warning title=Zip layout::{k}: extra {len(i.extra)} vs {len(j.extra)}, offset {i.header_offset} vs {j.header_offset}")
                  n += 1
          PY
